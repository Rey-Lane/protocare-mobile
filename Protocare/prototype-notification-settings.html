<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Protocare — Notification Settings Prototype</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', sans-serif; background: #f9f9f5; display: flex; justify-content: center; padding: 20px; }

  .phone { width: 393px; height: 852px; background: #fbfbf8; border-radius: 44px; overflow: hidden; box-shadow: 0 20px 60px rgba(0,0,0,.15); position: relative; display: flex; flex-direction: column; }

  /* iOS status bar mock */
  .status-bar { height: 54px; display: flex; align-items: flex-end; justify-content: space-between; padding: 0 32px 8px; font-size: 15px; font-weight: 600; color: #1a1a1a; flex-shrink: 0; }

  /* Nav bar */
  .nav-bar { display: flex; align-items: center; padding: 0 16px 12px; flex-shrink: 0; }
  .nav-back { font-size: 24px; color: #d8a490; cursor: pointer; width: 32px; }
  .nav-title { font-size: 17px; font-weight: 600; color: #1a1a1a; flex: 1; text-align: center; margin-right: 32px; }

  .content { flex: 1; overflow-y: auto; padding: 0 16px 40px; }

  /* Common components */
  .section-label { font-size: 13px; font-weight: 600; color: #8b7e74; text-transform: uppercase; letter-spacing: 0.5px; margin: 20px 0 8px 4px; }
  .card { background: #fff; border-radius: 14px; overflow: hidden; margin-bottom: 16px; box-shadow: 0 1px 3px rgba(0,0,0,.04); }
  .row { display: flex; align-items: center; padding: 14px 16px; gap: 14px; }
  .row + .row { border-top: 1px solid #e8e0d8; }
  .row-icon { width: 34px; height: 34px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 16px; flex-shrink: 0; }
  .row-text { flex: 1; min-width: 0; }
  .row-title { font-size: 16px; font-weight: 500; color: #1a1a1a; }
  .row-subtitle { font-size: 13px; color: #8b7e74; margin-top: 2px; }
  .row-right { font-size: 14px; color: #8b7e74; flex-shrink: 0; }

  /* Toggle */
  .toggle { width: 51px; height: 31px; border-radius: 16px; background: #e0d8d0; position: relative; cursor: pointer; transition: background .2s; flex-shrink: 0; }
  .toggle.on { background: #d8a490; }
  .toggle::after { content: ''; position: absolute; width: 27px; height: 27px; border-radius: 50%; background: #fff; top: 2px; left: 2px; transition: transform .2s; box-shadow: 0 1px 3px rgba(0,0,0,.15); }
  .toggle.on::after { transform: translateX(20px); }

  /* Time pill */
  .time-pill { background: #faf0ec; color: #d8a490; font-size: 13px; font-weight: 600; padding: 4px 10px; border-radius: 8px; }

  /* Badge */
  .badge { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .badge-on { background: #6b9f7a; }
  .badge-off { background: #ccc; }

  /* Divider inside card */
  .card-divider { height: 1px; background: #e8e0d8; margin: 0 16px 0 64px; }

  /* Master toggle header */
  .master-row { display: flex; align-items: center; justify-content: space-between; padding: 16px; background: #fff; border-radius: 14px; margin-bottom: 16px; box-shadow: 0 1px 3px rgba(0,0,0,.04); }
  .master-label { font-size: 16px; font-weight: 600; color: #1a1a1a; }

  /* Empty state */
  .empty { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 60px 20px; text-align: center; }
  .empty-icon { font-size: 48px; color: #e0d8d0; margin-bottom: 16px; }
  .empty-title { font-size: 17px; font-weight: 600; color: #1a1a1a; margin-bottom: 8px; }
  .empty-sub { font-size: 14px; color: #8b7e74; line-height: 1.5; }

  /* Floating switcher */
  .switcher { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #1a1a1a; color: #fff; border-radius: 28px; padding: 10px 20px; display: flex; align-items: center; gap: 16px; z-index: 999; box-shadow: 0 8px 32px rgba(0,0,0,.25); font-size: 14px; }
  .switcher button { background: none; border: none; color: #fff; font-size: 18px; cursor: pointer; padding: 4px 8px; border-radius: 8px; }
  .switcher button:hover { background: rgba(255,255,255,.15); }
  .switcher .label { min-width: 140px; text-align: center; }
  .switcher .variant-name { font-weight: 600; }
  .switcher .variant-desc { font-size: 11px; opacity: .7; }

  /* ===== Variant A: Grouped by Protocol ===== */
  .protocol-header { display: flex; align-items: center; gap: 10px; padding: 12px 16px; background: #faf5f2; border-radius: 12px; margin-bottom: 4px; }
  .protocol-dot { width: 10px; height: 10px; border-radius: 50%; }
  .protocol-name { font-size: 15px; font-weight: 600; color: #1a1a1a; flex: 1; }
  .protocol-count { font-size: 12px; color: #8b7e74; }

  /* ===== Variant B: Flat timeline ===== */
  .timeline-item { display: flex; gap: 14px; padding: 14px 16px; position: relative; }
  .timeline-item + .timeline-item { border-top: 1px solid #e8e0d8; }
  .timeline-time { width: 52px; font-size: 15px; font-weight: 600; color: #1a1a1a; text-align: right; flex-shrink: 0; padding-top: 2px; }
  .timeline-dot-col { width: 2px; background: #e8e0d0; position: relative; flex-shrink: 0; }
  .timeline-dot-col .dot { width: 10px; height: 10px; border-radius: 50%; border: 2px solid #d8a490; background: #fff; position: absolute; top: 18px; left: -4px; }
  .timeline-dot-col .dot.filled { background: #d8a490; }
  .timeline-content { flex: 1; }
  .timeline-action-name { font-size: 15px; font-weight: 500; color: #1a1a1a; }
  .timeline-protocol-name { font-size: 12px; color: #8b7e74; margin-top: 2px; }

  /* ===== Variant C: Compact cards ===== */
  .mini-card { background: #fff; border-radius: 14px; padding: 14px 16px; margin-bottom: 10px; box-shadow: 0 1px 3px rgba(0,0,0,.04); display: flex; align-items: center; gap: 12px; }
  .mini-card-left { flex: 1; min-width: 0; }
  .mini-card-time { font-size: 13px; font-weight: 600; color: #d8a490; }
  .mini-card-name { font-size: 15px; font-weight: 500; color: #1a1a1a; margin-top: 2px; }
  .mini-card-proto { font-size: 12px; color: #8b7e74; margin-top: 1px; }
  .mini-card-status { display: flex; align-items: center; gap: 6px; }
  .mini-card-status-dot { width: 7px; height: 7px; border-radius: 50%; }
  .mini-card-status-text { font-size: 12px; color: #8b7e74; }

  /* page description header */
  .page-desc { background: #faf5f2; border-radius: 12px; padding: 14px 16px; margin-bottom: 16px; font-size: 13px; color: #8b7e74; line-height: 1.5; }
  .page-desc strong { color: #1a1a1a; }
</style>
</head>
<body>

<div class="phone" id="phone">
  <div class="status-bar">
    <span>9:41</span>
    <span style="font-size:12px;">●●●●○</span>
  </div>
  <div class="nav-bar">
    <div class="nav-back">‹</div>
    <div class="nav-title">Notifications</div>
  </div>
  <div class="content" id="content"></div>
</div>

<!-- Floating switcher -->
<div class="switcher">
  <button onclick="prevVariant()">◀</button>
  <div class="label">
    <div class="variant-name" id="variantName">A</div>
    <div class="variant-desc" id="variantDesc">Grouped by Protocol</div>
  </div>
  <button onclick="nextVariant()">▶</button>
</div>

<script>
const variants = [
  { key: 'A', name: 'Grouped by Protocol', desc: 'Sections per protocol, each action toggleable' },
  { key: 'B', name: 'Flat Timeline', desc: 'Chronological list with time column, toggle per row' },
  { key: 'C', name: 'Compact Cards', desc: 'One card per reminder, swipe-to-delete feel' },
];

let current = 0;

// Mock data
const protocols = [
  {
    name: 'GLP-1 Protocol',
    color: '#d8a490',
    actions: [
      { name: 'Semaglutide 0.5mg', time: '08:00', enabled: true },
      { name: 'Vitamin D3 2000 IU', time: '08:00', enabled: true },
      { name: 'Protein Shake', time: '14:00', enabled: false },
    ]
  },
  {
    name: 'Skincare Routine',
    color: '#6b9f7a',
    actions: [
      { name: 'Retinol Serum', time: '21:00', enabled: true },
      { name: 'Moisturizer', time: '21:00', enabled: false },
      { name: 'SPF 50', time: '07:30', enabled: true },
    ]
  },
  {
    name: 'Fitness',
    color: '#5a80b5',
    actions: [
      { name: 'Stretching', time: '07:00', enabled: true },
      { name: 'Walk 30min', time: '18:00', enabled: false },
    ]
  }
];

function flattenActions() {
  return protocols.flatMap(p =>
    p.actions.map(a => ({ ...a, protocolName: p.name, protocolColor: p.color }))
  ).sort((a, b) => a.time.localeCompare(b.time));
}

function renderA() {
  const allActions = protocols.flatMap(p => p.actions);
  const enabledCount = allActions.filter(a => a.enabled).length;

  let html = `<div class="page-desc">
    <strong>Variant A:</strong> Actions grouped by protocol. Master toggle at top, per-action toggles inside each protocol section. Matches how users think about their routines.
  </div>`;

  html += `<div class="master-row">
    <div>
      <div class="master-label">Reminders</div>
      <div style="font-size:13px;color:#8b7e74;margin-top:2px;">${enabledCount} of ${allActions.length} active</div>
    </div>
    <div class="toggle ${enabledCount > 0 ? 'on' : ''}" onclick="this.classList.toggle('on')"></div>
  </div>`;

  protocols.forEach(p => {
    html += `<div class="section-label">${p.name}</div>`;
    html += `<div class="card">`;
    p.actions.forEach((a, i) => {
      if (i > 0) html += `<div class="card-divider"></div>`;
      html += `<div class="row">
        <div class="row-icon" style="background:${p.color}22;color:${p.color}">💊</div>
        <div class="row-text">
          <div class="row-title">${a.name}</div>
          <div class="row-subtitle">Remind at ${a.time}</div>
        </div>
        <div class="toggle ${a.enabled ? 'on' : ''}" onclick="this.classList.toggle('on')"></div>
      </div>`;
    });
    html += `</div>`;
  });

  return html;
}

function renderB() {
  const flat = flattenActions();
  const enabledCount = flat.filter(a => a.enabled).length;

  let html = `<div class="page-desc">
    <strong>Variant B:</strong> Chronological timeline view. All reminders sorted by time of day. Quick visual of your daily reminder schedule. Toggle per row.
  </div>`;

  html += `<div class="master-row">
    <div>
      <div class="master-label">All Reminders</div>
      <div style="font-size:13px;color:#8b7e74;margin-top:2px;">${enabledCount} of ${flat.length} active</div>
    </div>
    <div class="toggle ${enabledCount > 0 ? 'on' : ''}" onclick="this.classList.toggle('on')"></div>
  </div>`;

  html += `<div class="card">`;
  flat.forEach((a, i) => {
    if (i > 0) html += `<div style="height:1px;background:#e8e0d8;margin:0 16px 0 82px;"></div>`;
    html += `<div class="timeline-item">
      <div class="timeline-time">${a.time}</div>
      <div class="timeline-dot-col"><div class="dot ${a.enabled ? 'filled' : ''}"></div></div>
      <div class="timeline-content">
        <div class="timeline-action-name">${a.name}</div>
        <div class="timeline-protocol-name" style="color:${a.protocolColor}">${a.protocolName}</div>
      </div>
      <div class="toggle ${a.enabled ? 'on' : ''}" onclick="this.classList.toggle('on')"></div>
    </div>`;
  });
  html += `</div>`;

  return html;
}

function renderC() {
  const flat = flattenActions();
  const enabledCount = flat.filter(a => a.enabled).length;

  let html = `<div class="page-desc">
    <strong>Variant C:</strong> Compact card list. Each card = one reminder. Easy to scan, feels like a todo list. Toggle on each card.
  </div>`;

  html += `<div class="master-row">
    <div>
      <div class="master-label">Reminders</div>
      <div style="font-size:13px;color:#8b7e74;margin-top:2px;">${enabledCount} active</div>
    </div>
    <div class="toggle ${enabledCount > 0 ? 'on' : ''}" onclick="this.classList.toggle('on')"></div>
  </div>`;

  flat.forEach(a => {
    html += `<div class="mini-card">
      <div class="mini-card-left">
        <div class="mini-card-time">${a.time}</div>
        <div class="mini-card-name">${a.name}</div>
        <div class="mini-card-proto">${a.protocolName}</div>
      </div>
      <div class="toggle ${a.enabled ? 'on' : ''}" onclick="this.classList.toggle('on')"></div>
    </div>`;
  });

  return html;
}

function render() {
  const v = variants[current];
  document.getElementById('variantName').textContent = v.key;
  document.getElementById('variantDesc').textContent = v.desc;

  const c = document.getElementById('content');
  if (current === 0) c.innerHTML = renderA();
  else if (current === 1) c.innerHTML = renderB();
  else c.innerHTML = renderC();
}

function nextVariant() { current = (current + 1) % variants.length; render(); }
function prevVariant() { current = (current - 1 + variants.length) % variants.length; render(); }

document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
  if (e.key === 'ArrowRight') nextVariant();
  if (e.key === 'ArrowLeft') prevVariant();
});

render();
</script>
</body>
</html>
